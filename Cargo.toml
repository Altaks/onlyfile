[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Altaks"]
license = "MIT"

[workspace]
resolver = "3"
members = ["apps/cli", "libs/scanner"]

[workspace.dependencies]
# Async tasks scheduling, and stream management
tokio = { version = "1.48", features = ["full", "tracing", "rt-multi-thread"] }

# Logging like a pro
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
console-subscriber = "0.5.0"

# Environment variables loading
dotenvy = "0.15.7"

# Error management toolkit
thiserror = { version = "2.0.17" }
anyhow = { version = "1.0.100" }

# User interfaces
ratatui = { version = "0.30.0" }
crossterm = "0.29.0"

# Temporary files
tempfile = "3.24.0"

# Hashing algorithms
blake3 = { version = "1.8.3" }

# Bloom filters 
bloomfilter = { version = "3.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "warn"
if_let_rescope = "deny"
missing_copy_implementations = "warn"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
redundant_imports = "warn"
redundant_lifetimes = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"

# Tonic result types results in at least 176 bytes in Err variant
result_large_err = "allow"
