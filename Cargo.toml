[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Altaks"]
license = "MIT"

[workspace]
resolver = "3"
members = [
    "apps/cli",
    "libs/identity",
    "libs/model",
    "libs/purge",
    "libs/replica",
    "libs/scanner",
]

[workspace.dependencies]
identity = { path = "libs/identity" }
model = { path = "libs/model" }
purge = { path = "libs/purge" }
replica = { path = "libs/replica" }
scanner = { path = "libs/scanner" }

# Logging like a pro
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

# Error management toolkit
thiserror = { version = "2.0.17" }
anyhow = { version = "1.0.100" }

# User interfaces
ratatui = { version = "0.30.0" }
unicode-width = "0.2.2"

# Command line arguments
clap = { version = "4.6.7", features = ["derive"] }

# Platform folders, for the log file
directories = "6.0.0"

# Local dates for modification times
jiff = "0.2.38"

# Temporary files
tempfile = "3.24.0"

# Hashing algorithms

# First thought algorithm, but xx3 hashing allows to hash much more data per sec.
# See https://github.com/Cyan4973/xxHash/wiki/Performance-comparison#benchmarks-concentrating-on-small-data- 
# blake3 = { version = "1.8.3" } 

xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

# The platform trash: Finder or NSFileManager, freedesktop, the Recycle Bin
trash = "5.2.9"

# Windows file identity (volume serial number and file index), to recognise hardlinks
winapi-util = "0.1.11"

itertools = { version = "0.14.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "warn"
if_let_rescope = "deny"
missing_copy_implementations = "warn"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
redundant_imports = "warn"
redundant_lifetimes = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"

# Tonic result types results in at least 176 bytes in Err variant
result_large_err = "allow"
