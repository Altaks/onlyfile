name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked pull requests target each other, not only main.
  pull_request:

# A newer push to the same ref makes the running check irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the code: it publishes nothing and comments nowhere.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      # A failure on one OS must not hide the result of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Accelerator only: a cache miss or a failed save never fails the gate.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # fmt, clippy and test share one target dir, so they stay in one job
      # instead of compiling the workspace three times.
      - run: just gate
